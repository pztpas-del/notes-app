# Push server for calendar reminders. Deploy: npx wrangler deploy (from this folder).
name = "notes-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "notes-push"
database_id = "ad407fdb-fcd8-4bae-ac98-25bc9a1ac475"
